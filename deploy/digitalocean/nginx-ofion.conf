# /etc/nginx/sites-available/ofion

upstream bookshop_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name ofion.com.ua www.ofion.com.ua;

    client_max_body_size 25M;

    location /media/ {
        alias /var/www/bookshop/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /static/ {
        alias /var/www/bookshop/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://bookshop_gunicorn;
    }
}
