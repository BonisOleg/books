# /etc/nginx/sites-available/ofion
# Base HTTP config for fresh installs. Production usually also has Certbot SSL
# server blocks — do NOT blindly overwrite a live SSL site with this file.
# Prefer: nginx-bookshop-abuse-zones.conf + nginx-bookshop-abuse-locations.conf
# via apply_abuse_blocking.sh
# HTTPS (Certbot) server is not in this file. Live SSL block needs:
#   listen 443 ssl http2;
# Apply on the droplet: sudo bash deploy/digitalocean/apply_performance.sh

upstream bookshop_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# www → apex (HTTP). After Certbot, HTTPS www redirect is handled by the snippet.
server {
    listen 80;
    server_name www.ofion.com.ua;
    return 301 https://ofion.com.ua$request_uri;
}

server {
    listen 80;
    server_name ofion.com.ua;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    location /media/ {
        alias /var/www/bookshop/media/;
        # Варіанти — окремі URL (.w480.webp), не Accept-negotiation.
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /static/ {
        alias /var/www/bookshop/staticfiles/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    include /etc/nginx/snippets/bookshop-abuse-locations.conf;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://bookshop_gunicorn;
    }
}
