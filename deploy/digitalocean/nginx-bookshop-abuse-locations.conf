# Snippet: rate-limited locations for cart / checkout / oneclick.
# Include inside each server { } block BEFORE location /.
#   include /etc/nginx/snippets/bookshop-abuse-locations.conf;

location ~ ^/cart/(add|update|remove)/ {
    limit_req zone=abuse_cart burst=8 nodelay;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_redirect off;
    proxy_buffering off;
    proxy_pass http://bookshop_gunicorn;
}

location ~ ^/orders/(checkout|oneclick)/ {
    limit_req zone=abuse_checkout burst=4 nodelay;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_redirect off;
    proxy_buffering off;
    proxy_pass http://bookshop_gunicorn;
}
