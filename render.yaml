# Render Blueprint — Магазин книжок (Django 5 + Cloudinary + Postgres)
# Версія схеми перевірена з документацією Render станом на квітень 2026.
# Деплой: Render Dashboard → New + → Blueprint → обрати репозиторій з цим файлом.

databases:
  - name: bookshop-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []  # лише внутрішня мережа Render

services:
  - type: web
    name: bookshop
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-3} --threads ${WEB_THREADS:-2} --worker-class gthread --timeout 60 --keep-alive 5 --access-logfile - --error-logfile -"
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: WEB_THREADS
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"

      # Django core
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_ALLOWED_HOSTS
        sync: false  # додати: bookshop.onrender.com,your-domain.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # https://bookshop.onrender.com,https://your-domain.com

      # База даних — підтягується з блок databases вище
      - key: DATABASE_URL
        fromDatabase:
          name: bookshop-db
          property: connectionString

      # Cloudinary (медіа з адмінки)
      - key: CLOUDINARY_URL
        sync: false  # cloudinary://API_KEY:API_SECRET@CLOUD_NAME

      # Gmail SMTP (App Password)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Сайт
      - key: SITE_DOMAIN
        sync: false  # bookshop.onrender.com або кастомний домен
      - key: SITE_PROTOCOL
        value: https

      # Платежі / Доставка / Месенджери (опційно)
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      - key: MONOBANK_TOKEN
        sync: false
      - key: NOVAPOSHTA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: VIBER_BOT_URI
        sync: false

      # Опційно: Sentry
      - key: SENTRY_DSN
        sync: false
