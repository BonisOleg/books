{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/admin-order-ttn.css' %}">
{% endblock %}

{% block submit_buttons_bottom %}
{{ block.super }}
{% if original %}
<div class="submit-row np-ttn-submit-row">
    <button type="submit"
            class="button np-ttn-submit"
            formaction="{% url 'admin:orders_order_create_ttn' original.pk %}"
            formmethod="post"
            formnovalidate>
        Створити ТТН
    </button>
    {% if ttn_needs_payment_confirm %}
    <button type="submit"
            class="button np-ttn-submit"
            name="confirm"
            value="1"
            formaction="{% url 'admin:orders_order_create_ttn' original.pk %}"
            formmethod="post"
            formnovalidate>
        Підтвердити створення ТТН
    </button>
    {% endif %}
</div>
{% endif %}
{% endblock %}
