{% extends "admin/change_form.html" %}

{% block object-tools-items %}
{{ block.super }}
{% if original and has_change_permission %}
<li class="supplier-sync-tool">
    <form method="post" action="{% url 'admin:suppliers_supplier_dry_run' original.pk %}" class="supplier-sync-form">
        {% csrf_token %}
        <button type="submit" class="supplier-sync-btn">Перевірити (dry-run)</button>
    </form>
</li>
<li class="supplier-sync-tool">
    <form method="post" action="{% url 'admin:suppliers_supplier_sync' original.pk %}" class="supplier-sync-form" onsubmit="return confirm('Запустити синхронізацію і оновити каталог?');">
        {% csrf_token %}
        <button type="submit" class="supplier-sync-btn supplier-sync-btn--run">Запустити</button>
    </form>
</li>
{% endif %}
{% endblock %}
