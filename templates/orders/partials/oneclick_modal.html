{% load core_tags %}
<div id="oneclick-modal" style="position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);">
    <div style="background:#fff;border-radius:var(--radius-md);padding:24px;max-width:380px;width:90%;position:relative;">
        <button onclick="document.getElementById('oneclick-modal').remove()"
                style="position:absolute;top:8px;right:12px;font-size:1.25rem;background:none;border:none;cursor:pointer;">&times;</button>
        <h3 style="font-size:1rem;margin-bottom:16px;">Купити в 1 клік</h3>
        <p style="font-size:0.875rem;margin-bottom:12px;">{{ product.name }}</p>
        <p style="font-size:1.125rem;font-weight:700;margin-bottom:16px;">{{ product.price|uah }}</p>
        <form hx-post="{% url 'orders:oneclick' product.id %}" hx-target="#oneclick-modal" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label form-label--required">Телефон</label>
                {{ form.phone }}
            </div>
            <div class="form-group">
                <label class="form-label">Ваше ім'я</label>
                {{ form.name }}
            </div>
            <button type="submit" class="btn btn--buy btn--block" style="margin-top:12px;">Замовити</button>
        </form>
    </div>
</div>
