{% load core_tags %}
<div id="oneclick-modal" class="modal">
    <div class="modal__dialog">
        <button type="button" class="modal__close" data-modal-close aria-label="Закрити">&times;</button>
        <h3 class="modal__title">Купити в 1 клік</h3>
        <p class="modal__text">{{ product.name }}</p>
        <p class="modal__price">{{ product.price|uah }}</p>
        <form hx-post="{% url 'orders:oneclick' product.id %}" hx-target="#oneclick-modal" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label form-label--required">Телефон</label>
                {{ form.phone }}
            </div>
            <div class="form-group">
                <label class="form-label">Ваше ім'я</label>
                {{ form.name }}
            </div>
            <button type="submit" class="btn btn--buy btn--block modal__submit">Замовити</button>
        </form>
    </div>
</div>
