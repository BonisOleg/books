{% load core_tags i18n %}
<div id="oneclick-modal" class="modal">
    <div class="modal__dialog">
        <button type="button" class="modal__close" data-modal-close aria-label="{% trans 'Закрити' %}">&times;</button>
        <h3 class="modal__title">{% trans "Купити в 1 клік" %}</h3>
        <p class="modal__text">{{ product.name }}</p>
        <p class="modal__price">{{ product.price|uah }}</p>
        <form hx-post="{% url 'orders:oneclick' product.id %}" hx-target="#oneclick-modal" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label form-label--required">{% trans "Телефон" %}</label>
                {{ form.phone }}
                {% if form.phone.errors %}<div class="form-error">{{ form.phone.errors.0 }}</div>{% endif %}
            </div>
            <div class="form-group">
                <label class="form-label">{% trans "Ваше ім'я" %}</label>
                {{ form.name }}
            </div>
            <button type="submit" class="btn btn--buy btn--block modal__submit">{% trans "Замовити" %}</button>
        </form>
    </div>
</div>
