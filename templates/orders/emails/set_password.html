<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Встановлення пароля</title>
</head>
<body>
    <h2>Встановлення пароля</h2>
    <p>Доброго дня, {{ user.first_name|default:user.username }}!</p>
    <p>Для вас створено акаунт у {{ site_name }}.</p>
    <p>Щоб встановити пароль і увійти в особистий кабінет:</p>

    <p>Якщо ви не оформлювали замовлення — просто проігноруйте цей лист.</p>
    <p>З повагою,<br>команда {{ site_name }}</p>
</body>
</html>
