{% load core_tags %}

{% if products %}
<h3 class="gift-results__title">Рекомендовані подарунки:</h3>
<div class="gift-results__grid">
    {% for product in products %}
    {% include "includes/product_card.html" with product=product %}
    {% endfor %}
</div>
{% else %}
<div class="gift-results__empty">
    <p>На жаль, за вашими критеріями нічого не знайдено.</p>
    <a href="{% url 'products:catalog' %}" class="btn btn--outline">Переглянути каталог</a>
</div>
{% endif %}
