{% load i18n %}
<div class="modal consult-modal"
     id="consult-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="consult-modal-title"
     data-error-text="{% trans 'Не вдалося надіслати форму. Спробуйте ще раз.' %}">
    <div class="modal__dialog">
        <a href="{{ product.get_absolute_url }}"
           class="modal__close"
           data-consult-close
           aria-label="{% trans 'Закрити' %}">&times;</a>
        <h3 class="modal__title" id="consult-modal-title">{% trans 'Проконсультуватися' %}</h3>
        <p class="modal__text">{{ product.name }}</p>
        <p class="modal__text consult-modal__success" data-consult-success hidden></p>
        <form method="post"
              action="{% url 'products:consult' product.slug %}"
              data-consult-form
              accept-charset="UTF-8"
              autocomplete="on">
            {% csrf_token %}
            {{ consult_form.form_ts }}
            <div class="u-hp" aria-hidden="true">
                <label for="{{ consult_form.website.id_for_label }}">{% trans 'Сайт' %}</label>
                {{ consult_form.website }}
            </div>
            <div class="form-error" data-consult-status role="alert" hidden></div>
            <div class="form-group">
                <label class="form-label form-label--required" for="{{ consult_form.name.id_for_label }}">{% trans "Ім'я" %}</label>
                {{ consult_form.name }}
                <div class="form-error" id="consult-error-name" data-error-for="name" hidden></div>
            </div>
            <div class="form-group">
                <label class="form-label form-label--required" for="{{ consult_form.phone.id_for_label }}">{% trans 'Телефон' %}</label>
                {{ consult_form.phone }}
                <div class="form-error" id="consult-error-phone" data-error-for="phone" hidden></div>
            </div>
            <div class="form-group">
                <label class="form-label form-label--required" for="{{ consult_form.question.id_for_label }}">{% trans 'Питання' %}</label>
                {{ consult_form.question }}
                <div class="form-error" id="consult-error-question" data-error-for="question" hidden></div>
            </div>
            <button type="submit" class="btn btn--buy btn--block modal__submit">{% trans 'Надіслати' %}</button>
        </form>
    </div>
</div>
