{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/blog.css' %}">
{% endblock %}

{% block content %}
<div class="container blog-detail">
    <div class="blog-detail__header">
        <div class="blog-detail__date">{{ news_item.created_at|date:"d.m.Y" }}</div>
        <h1 class="blog-detail__title">{{ news_item.title }}</h1>
    </div>

    {% if news_item.image %}
    <img class="blog-detail__img" src="{{ news_item.image.url }}" alt="{{ news_item.title }}">
    {% endif %}

    <div class="blog-detail__content">
        {{ news_item.content|safe }}
    </div>

    <div style="margin-top:32px;">
        <a href="{% url 'blog:news_list' %}" class="btn btn--outline">&larr; Усі новини</a>
    </div>
</div>
{% endblock %}
