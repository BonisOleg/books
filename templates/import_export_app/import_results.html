{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock %}

{% block content %}
<div class="container auth-page">
    <h1 class="auth-page__title">Результати імпорту</h1>

    <div class="checkout-section">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Рядок</th>
                    <th>SKU</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody>
                {% for r in results %}
                <tr>
                    <td>{{ r.row }}</td>
                    <td>{{ r.sku }}</td>
                    <td>{{ r.status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="{% url 'import_export_app:dashboard' %}" class="btn btn--outline import-export__back">
        &larr; Назад
    </a>
</div>
{% endblock %}
