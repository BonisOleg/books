{% extends "base.html" %}
{% load static core_tags %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/blog.css' %}">
{% endblock %}

{% block content %}
<div class="container blog-detail">
    <div class="blog-detail__header">
        <h1 class="blog-detail__title">{{ page.title }}</h1>
    </div>

    <div class="blog-detail__content">
        {{ page.content|safe }}
    </div>

    {% faq "page" %}
</div>
{% endblock %}
