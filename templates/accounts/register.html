{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock %}

{% block content %}
<div class="container auth-page">
    <h1 class="auth-page__title auth-page__title--centered">Реєстрація</h1>

    <div class="checkout-section">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="form-label{% if field.field.required %} form-label--required{% endif %}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="form-error">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn--primary btn--block checkout-page__submit">Зареєструватися</button>
        </form>
        <p class="auth-redirect">
            Вже маєте акаунт? <a href="{% url 'accounts:login' %}">Увійти</a>
        </p>
    </div>
</div>
{% endblock %}
